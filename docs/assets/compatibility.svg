<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">MPMPESCore multi-protocol architecture</title>
<desc id="desc">Six MCPE client families connect through one UDP port and the MultiProtocol layer to shared players, chunks and entities. Protocol 70 is the native baseline. Feature limitations are documented in README.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1">
    <stop stop-color="#102b31"/><stop offset="1" stop-color="#09171e"/>
  </linearGradient>
  <linearGradient id="face" x2="1" y2="1">
    <stop stop-color="#9af5c6"/><stop offset="1" stop-color="#4dc5b5"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop stop-color="#225a55" stop-opacity=".65"/>
    <stop offset="1" stop-color="#225a55" stop-opacity="0"/>
  </radialGradient>
</defs>
